spring:
  application:
    name: authentication-authorization-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "Abcd1234!"
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID} // for local test replace this by actual client id
            client-secret: ${GOOGLE_CLIENT_SECRET} // replace this by actual client secret
            scope:
              - email
              - profile
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # For newer Spring/Hibernate versions, sometimes this is needed:
        format_sql: true
jwt:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem
